<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Dynamic Flow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glowing Text Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* CSS Animations for Background Dynamic Graphic Aspects */
    @keyframes pulsePulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.08) translate(-10px, 15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashOffset {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .bg-node { animation: pulsePulse 8s ease-in-out infinite; transform-origin: center; }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 20 10; animation: dashOffset 30s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Grid Pattern (Subtle) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="300" fill="url(#grid)" />
  </g>

  <!-- Dynamic / Animated Background Graphics (Behind Text) -->
  <g class="bg-node" opacity="0.4">
    <!-- Storage Array Vector Nodes -->
    <circle cx="150" cy="80" r="120" fill="#3b82f6" filter="blur(50px)"/>
    <circle cx="1050" cy="220" r="140" fill="#8b5cf6" filter="blur(60px)"/>
    <circle cx="900" cy="60" r="90" fill="#ec4899" filter="blur(45px)"/>
  </g>

  <!-- Storage Data Flow Lines -->
  <path class="flow-line" d="M -50 230 Q 300 280 600 230 T 1250 250" fill="none" stroke="url(#lineGrad)" stroke-width="4"/>
  <path class="flow-line" d="M -50 250 Q 400 180 800 270 T 1250 200" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Server Block Storage Stack Graphics (Bottom Right Decorative) -->
  <g transform="translate(940, 90)" opacity="0.35" class="particle">
    <!-- Storage Rack Unit 1 -->
    <rect x="0" y="0" width="180" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="4" fill="#4ade80"/>
    <circle cx="35" cy="18" r="4" fill="#38bdf8"/>
    <line x1="60" y1="18" x2="160" y2="18" stroke="#475569" stroke-width="3" stroke-dasharray="8 4"/>

    <!-- Storage Rack Unit 2 -->
    <rect x="0" y="46" width="180" height="36" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="20" cy="64" r="4" fill="#4ade80"/>
    <circle cx="35" cy="64" r="4" fill="#818cf8"/>
    <line x1="60" y1="64" x2="160" y2="64" stroke="#475569" stroke-width="3" stroke-dasharray="12 4"/>

    <!-- Storage Rack Unit 3 -->
    <rect x="0" y="92" width="180" height="36" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="20" cy="110" r="4" fill="#4ade80"/>
    <circle cx="35" cy="110" r="4" fill="#c084fc"/>
    <line x1="60" y1="110" x2="160" y2="110" stroke="#475569" stroke-width="3" stroke-dasharray="6 4"/>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Visibility & Foreground Placement) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="320" height="32" rx="16" fill="url(#pillGrad)" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="21" class="badge-text">⚡ ENTERPRISE &amp; KUBERNETES STORAGE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title">Awesome Cloud Block Storage 🗄️</text>

    <!-- Subtitle -->
    <text x="0" y="178" class="subtitle">High-Performance Cloud Disks, SDS &amp; Kubernetes CSI Storage Engines</text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 210)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">☁️ Hyperscaler EBS/Disks</text>

      <!-- Pill 2 -->
      <rect x="182" y="0" width="185" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="196" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">🐙 Ceph &amp; Software Defined</text>

      <!-- Pill 3 -->
      <rect x="379" y="0" width="175" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="393" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">☸️ OpenEBS &amp; Longhorn</text>
    </g>
  </g>
</svg>
